[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr_core"
version = "0.1.0"
description = "Shared DSP, I/O and visualization primitives used across the SDR Portfolio projects"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "matplotlib",
    "pyrtlsdr",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdr_core*"]
